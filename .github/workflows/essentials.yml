name: Parser and writer essentials
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    # The pinned DuckDB/fmt dependency still uses stdext::checked_array_iterator,
    # which MSVC 14.51 removed. Use the supported Visual Studio 2022 toolchain.
    runs-on: windows-2022
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            DemoWriter -> ../target
            src/demoparser_rust -> ../../target
      - name: Writer library tests
        working-directory: DemoWriter
        run: cargo test --locked --all-targets
      - name: Parser fixture-free tests
        working-directory: src/parser
        run: cargo test --locked --lib
      - name: Build essential executables
        run: python scripts/build.py
      - name: Application library tests
        working-directory: src/demoparser_rust
        # Reuse the release DuckDB build rather than compiling it again in debug.
        run: cargo test --release --locked --lib
      - name: Downloader library tests
        working-directory: src/demoparser_rust
        run: cargo test --release --locked -p demofetch --lib
      - name: Check integrated map command
        run: |
          ./out/Demoparser.exe retarget --help
          ./out/Demoparser.exe --capabilities
          if (Test-Path ./out/light-demo-probe.exe) { ./out/light-demo-probe.exe --help }
