# Portable example; copy beside Demoparser.exe and edit paths as needed.
[Paths]
ParserOutput = output
ram_unzip = true

[Parser]
process_tick_data = true
PadTicks = 0
TrackAllPlayers = 1
overwrite = false
Aces = true
Quads = true
Triples = true
Multi = true
Singles = true
Doubles = true
grenade_trajectory_mode = 2

[Downloader]
batch_size = 8

[Batch]
max_concurrent_files = 1
