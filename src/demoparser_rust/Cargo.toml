[package]
name = "demoparser"
autobins = false
version = "1.0.0"
edition = "2021"
description = "Unified CS:GO Demo Parser - Extract kill collections and tick-by-tick data"

[[bin]]
name = "Demoparser"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    "interface",
    "KillCollectionWriter",
    "KillCollectionWriter/KillCollectionMaster",
    "config",
    "CollectionBrowser",
    "demofetch",
]

[dependencies]
# CLI and async
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
configparser = "3.0"
sha2 = "0.10"

# File handling
flate2 = "1.0"
lz4_flex = "=0.11.6"
crc32fast = "1.5"
zstd = "0.13"
memmap2 = "0.9"
tempfile = { workspace = true }

# Progress and parallel processing
indicatif = "0.17"
rayon = "1.8"

# Other
ahash = "0.8"
log = "0.4"

# Other
dashmap = "5.5.3"
once_cell = "1.19"

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }
windows = { version = "0.52", features = [
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Kernel"
] }

# Database
duckdb = "1.1.3"

# Local dependencies
config = { path = "config" }
interface = { path = "interface" }
kill_collection_master = { path = "KillCollectionWriter/KillCollectionMaster" }
parser = { path = "../parser" }
demo-writer = { path = "../../DemoWriter" }
demofetch = { path = "demofetch" }

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.1"
chrono = "0.4"
rayon = "1.8"
tokio = { version = "1.0", features = ["full"] }
indicatif = "0.17"
flate2 = "1.0"
zstd = "0.13"
tempfile = "3"
