[package]
name = "collection_browser"
version = "0.1.0"
edition = "2021"
description = "GUI browser for DuckDB kill collections"

[[bin]]
name = "CollectionBrowser"
path = "src/main.rs"

[dependencies]
iced = { version = "0.12", features = ["canvas", "tokio", "advanced", "image"] }
duckdb = { version = "1.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
ini = "1.3"
anyhow = "1.0"
chrono = "0.4"
rfd = "0.14"
demoparser = { path = ".." }
demoparser_config = { path = "../config", package = "config" }
tokio = { version = "1.0", features = ["full"] }
ndarray = "0.15"
ndarray-npy = "0.8"
image = "0.24"

[dev-dependencies]
tempfile = { workspace = true }
